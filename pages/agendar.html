<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Horário | Fartura Veículos Multimarcas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>body{visibility:hidden;opacity:0;transition:opacity .18s ease}</style>
  <script>
    (function waitAndProtect(){
      if (window.db && window.Auth) {
        window.Auth.protegerPagina('cliente')
          .then(profile => {
            if (profile) {
              document.body.style.visibility = 'visible';
              document.body.style.opacity = '1';
            }
          })
          .catch(() => { window.location.href = 'login.html'; });
      } else {
        setTimeout(waitAndProtect, 50);
      }
    })();
  </script>
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">FARTURA</a>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Início</a>
        <a href="agendar.html" class="active"><i class="fa-solid fa-calendar-plus"></i> Agendar Consulta</a>
        <a href="minhas-consultas.html"><i class="fa-solid fa-calendar-check"></i> Minhas Consultas</a>
        <a href="perfil.html"><i class="fa-solid fa-user"></i> Meu Perfil</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Agendar Horário</h1>
      </div>

      <p style="color:var(--color-gray-600);margin-bottom:1rem;">
        Status: disponível · lotado · indisponível
      </p>

      <div id="calendar-container"></div>
    </main>
  </div>

  <!-- ===================== MODAL DE HORÁRIOS ===================== -->
  <div class="modal-overlay hidden" id="modal-horarios">
    <div class="modal-box">
      <button class="modal-close" id="fechar-modal" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modal-data-titulo">Horários disponíveis</h3>
      <div class="time-slots" id="time-slots"></div>

      <div class="form-grid">
        <div class="form-group">
          <label for="select-servico">Serviço</label>
          <select id="select-servico" class="form-control"></select>
        </div>
        <div class="form-group">
          <label for="select-profissional">Profissional</label>
          <select id="select-profissional" class="form-control"></select>
        </div>
      </div>

      <h4>Dados do veículo</h4>
      <div class="form-grid">
        <div class="form-group"><label for="veiculo-marca">Marca</label><input id="veiculo-marca" class="form-control" type="text"></div>
        <div class="form-group"><label for="veiculo-modelo">Modelo</label><input id="veiculo-modelo" class="form-control" type="text"></div>
        <div class="form-group"><label for="veiculo-ano">Ano</label><input id="veiculo-ano" class="form-control" type="number" min="1900" max="2099"></div>
        <div class="form-group"><label for="veiculo-cor">Cor</label><input id="veiculo-cor" class="form-control" type="text"></div>
        <div class="form-group"><label for="veiculo-placa">Placa</label><input id="veiculo-placa" class="form-control" type="text"></div>
      </div>

      <div class="form-group">
        <label for="observacoes">Observações (opcional)</label>
        <textarea id="observacoes" class="form-control" rows="3" placeholder="Ex: banco de couro, janela trincada..."></textarea>
      </div>

      <button class="btn btn-primary" id="confirmar-agendamento" style="width:100%;" disabled>Agendar</button>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../config/firebase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/utils/validators.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/booking.js"></script>
  <script src="../js/modules/notifications.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/agendar.js"></script>
  <script src="../js/modules/whatsapp.js"></script>
</body>
</html>
