<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações | Painel Admin</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="../index.html" class="logo">Admin</a>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="admin-agendamentos.html"><i class="fa-solid fa-calendar-check"></i> Agendamentos</a>
        <a href="admin-servicos.html"><i class="fa-solid fa-wrench"></i> Serviços</a>
        <a href="admin-profissionais.html"><i class="fa-solid fa-user-tie"></i> Profissionais</a>
        <a href="admin-pacientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="admin-disponibilidade.html"><i class="fa-solid fa-clock"></i> Disponibilidade</a>
        <a href="admin-configuracoes.html" class="active"><i class="fa-solid fa-gear"></i> Configurações</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;">Sair</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="content-header">
        <h1>Configurações</h1>
      </div>
      <div class="card" style="max-width:780px;">
        <h3>WhatsApp</h3>
        <p>Configure o número e a mensagem padrão usada pelo botão flutuante.</p>
        <div class="form-group">
          <label for="wh-number">Número (formato internacional, ex: 5511999999999)</label>
          <input id="wh-number" class="form-control" placeholder="5511999999999">
        </div>
        <div class="form-group">
          <label for="wh-msg">Mensagem padrão</label>
          <input id="wh-msg" class="form-control" placeholder="Olá, quero agendar um serviço">
        </div>
        <button id="save-config" class="btn btn-primary">Salvar</button>
        <div style="margin-top:1rem;color:var(--color-gray-600);font-size:0.95rem;">Obs: as configurações estão armazenadas na tabela <strong>configuracoes</strong>.</div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/admin.js"></script>
  <script src="../js/pages/admin-configuracoes.js"></script>
</body>
</html>
