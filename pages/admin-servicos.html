<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços | Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div id="loading-screen"><div class="spinner"></div></div>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <a href="../index.html" class="logo">Admin</a>
      <nav class="sidebar-nav">
        <a href="admin-dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="admin-agendamentos.html"><i class="fa-solid fa-calendar-check"></i> Agendamentos</a>
        <a href="admin-servicos.html" class="active"><i class="fa-solid fa-wrench"></i> Serviços</a>
        <a href="admin-profissionais.html"><i class="fa-solid fa-user-tie"></i> Profissionais</a>
        <a href="admin-pacientes.html"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="admin-disponibilidade.html"><i class="fa-solid fa-clock"></i> Disponibilidade</a>
      </nav>
      <div class="sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-sm" style="width:100%;">Sair</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="content-header">
        <button id="sidebar-toggle" class="mobile-menu-btn btn btn-outline btn-sm"><i class="fa-solid fa-bars"></i></button>
        <h1>Serviços</h1>
        <div style="margin-left:auto;display:flex;gap:0.5rem;">
          <button id="novo-servico" class="btn btn-cta small">+ Novo Serviço</button>
        </div>
      </div>
      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>Nome</th><th>Duração</th><th>Preço</th><th>Ativo</th><th>Ações</th></tr></thead>
            <tbody id="servicos-tbody"><tr><td colspan="5">Carregando...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay hidden" id="modal-servico">
    <div class="modal-box">
      <button class="modal-close" id="fechar-modal-servico"><i class="fa-solid fa-xmark"></i></button>
      <h3 id="modal-title">Novo serviço</h3>
      <div class="form-group"><label>Nome</label><input id="serv-nome" class="form-control"></div>
      <div class="form-group"><label>Descrição</label><textarea id="serv-desc" class="form-control" rows="3"></textarea></div>
      <div class="form-grid"><div class="form-group"><label>Duração (min)</label><input id="serv-dur" type="number" class="form-control" value="30"></div><div class="form-group"><label>Preço</label><input id="serv-preco" type="number" step="0.01" class="form-control"></div></div>
      <div class="form-group"><label>URL da Imagem (opcional)</label><input id="serv-foto" class="form-control"></div>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.8rem;"><button id="salvar-servico" class="btn btn-cta small">Salvar</button><button id="excluir-servico" class="btn btn-danger small hidden">Excluir</button></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/utils/toast.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script src="../js/modules/admin.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/admin-servicos.js"></script>
</body>
</html>
